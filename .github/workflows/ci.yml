name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded in-progress runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI installs from the committed PEP 751 pylock.toml via uv (deterministic,
# cached). hatch dep sync is avoided: its locked sync exits non-zero on a fresh
# environment, while uv consumes the same lockfile reliably.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "pylock.toml"

      - name: Install locked dependencies + project
        run: |
          uv venv --python 3.14
          uv pip sync pylock.toml
          uv pip install -e . --no-deps

      - name: Run ruff
        run: .venv/bin/ruff check src/ tests/ scripts/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "pylock.toml"

      - name: Install locked dependencies + project
        run: |
          uv venv --python 3.14
          uv pip sync pylock.toml
          uv pip install -e . --no-deps

      - name: Run mypy
        run: .venv/bin/mypy src/ scripts/

  # The atom checks: facts stored in more than one place (Python version, ruff
  # version, dev list, floors vs lock). --consistency-only skips the build,
  # twine and TODO checks, which belong to a release rather than a PR.
  consistency:
    name: Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Run consistency checks
        run: python scripts/verify_release.py --consistency-only

  # Only unit tests run in CI; integration tests need live API keys.
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "pylock.toml"

      - name: Install locked dependencies + project
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip sync pylock.toml
          uv pip install -e . --no-deps

      # coverage run -m pytest, NOT pytest --cov: the pytest11 entry point loads
      # the plugin (and everything it imports at module scope) before pytest-cov
      # starts measuring, so those lines are miscounted as never executed. That
      # understated the figure fed to Codecov by 22 points - 69% against a real
      # 91%, 478 missed statements against 103. -o addopts="" drops the inherited
      # --cov flags so the two mechanisms do not fight.
      - name: Run unit tests
        run: |
          .venv/bin/coverage run --source=src/ragaliq -m pytest \
            tests/unit/ tests/meta/test_meta_metrics.py -o addopts="" -q
          .venv/bin/coverage report
          .venv/bin/coverage xml -o coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./coverage.xml
          # fail_ci_if_error: false keeps CI green even if Codecov is down.
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
