name: Meta Evaluation

# Live judge-quality benchmark. This job makes real, paid Anthropic API calls,
# so it is deliberately NOT wired to push or pull_request — per-PR would bill
# every push. Weekly plus manual dispatch only.
#
# What it gates: the agreement floors and the pinned macro-F1 baseline in
# tests/meta/baselines/judge_agreement_baseline.json (see issues #89 and #90).
# A baseline measured on another golden set is refused; a changed model, prompt
# or anthropic version is compared and named in the summary. A red run means judge
# quality moved or the baseline needs a re-pin, not that the build broke. The
# summary also lists the golden cases' claim counts (K) against the recorded ones
# (#108); that table never fails the run.
on:
  schedule:
    # Mondays 06:30 Melbourne time: with the 6 to 9 hour start delays seen, runs still land before 17:00.
    - cron: "30 6 * * 1"
      timezone: "Australia/Melbourne"
  workflow_dispatch:

# Never run two paid evaluations at once.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write  # the failure reporter opens/comments on a tracking issue

jobs:
  meta-eval:
    name: Judge agreement vs golden set
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "pylock.toml"

      # Same install path as ci.yml: the gate must measure the locked
      # dependency set, not a floating resolution.
      - name: Install locked dependencies + project
        run: |
          uv venv --python 3.14
          uv pip sync pylock.toml
          uv pip install -e . --no-deps

      - name: Run meta evaluation
        env:
          RAGALIQ_RUN_META: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .venv/bin/pytest tests/meta/ -m meta --no-cov -v -s

      # A weekly job that fails on nobody's PR reaches one person by default:
      # GitHub notifies only the workflow's creator, or whoever last changed
      # its cron syntax or re-enabled it, and that is easy to filter away.
      # Deduplicated on purpose — a fresh issue every week is noise, and
      # noise is how a red gate starts reading as green.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --label meta-eval-failure --state open \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL"
          else
            gh issue create \
              --title "[FIX] Scheduled meta-eval failed" \
              --label bug,testing,meta-eval-failure \
              --body "Run: $RUN_URL

          The weekly judge-agreement gate failed. Check the drift delta, or whether the
          pinned baseline was refused as stale, before assuming a judge regression - #102 was a
          fixture defect, not the judge. An auth failure looks the same from here:
          confirm ANTHROPIC_API_KEY is valid before investigating scores."
          fi

      # Runs on failure too — a regression is exactly when the numbers matter.
      - name: Write agreement numbers to step summary
        if: always()
        run: |
          SNAPSHOT=tests/meta/baselines/judge_agreement_latest.json

          if [ ! -f "$SNAPSHOT" ]; then
            echo "### Meta evaluation" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No snapshot produced — the run failed before judging completed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          .venv/bin/python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os

          from tests.meta.meta_metrics import INCOMPARABLE_INPUTS, fingerprint_drift

          snap = json.load(open("tests/meta/baselines/judge_agreement_latest.json"))
          base = None
          drift = {}
          if os.path.exists("tests/meta/baselines/judge_agreement_baseline.json"):
              base = json.load(open("tests/meta/baselines/judge_agreement_baseline.json"))
              drift = fingerprint_drift(base, snap["model"])

          print("### Meta evaluation")
          print()
          print(f"Model `{snap['model']}` — n={snap['n']}")
          print()
          if set(drift) & INCOMPARABLE_INPUTS:
              print("Baseline refused: it was measured on another golden set, so no delta is shown.")
              base = None
          elif drift:
              print("Baseline pinned on other inputs; the delta measures this change:")
          if drift:
              print()
              for line in drift.values():
                  print(f"- {line}")
              print()
          print("| Metric | This run | Baseline | Delta |")
          print("|--------|----------|----------|-------|")
          for key, label in (
              ("accuracy", "accuracy"),
              ("cohen_kappa", "Cohen's kappa"),
              ("macro_f1", "macro-F1"),
          ):
              cur = snap[key]
              if base is None:
                  print(f"| {label} | {cur:.4f} | — | — |")
              else:
                  ref = base[key]
                  print(f"| {label} | {cur:.4f} | {ref:.4f} | {cur - ref:+.4f} |")

          print()
          print("| Class | P | R | F1 | support |")
          print("|-------|---|---|-----|---------|")
          for name, m in snap["per_class"].items():
              print(
                  f"| {name} | {m['precision']:.2f} | {m['recall']:.2f} "
                  f"| {m['f1']:.2f} | {m['support']} |"
              )
          PY

          CASES=tests/meta/baselines/golden_cases_latest.json
          if [ -f "$CASES" ]; then
            .venv/bin/python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          rows = json.load(open("tests/meta/baselines/golden_cases_latest.json"))
          print()
          print("#### Claim counts (K) of the golden cases")
          print()
          print("Reported, not gated (#108): a K that differs from the recorded one does not fail the run.")
          print()
          print("| Case | K | Recorded K | Delta |")
          print("|------|---|------------|-------|")
          for row in rows:
              k, recorded, delta = row.get("k"), row.get("recorded_k"), row.get("k_delta")
              shown = "n/a" if delta is None else f"{delta:+d}"
              k_shown = "n/a" if k is None else k
              recorded_shown = "n/a" if recorded is None else recorded
              print(f"| {row['id']} | {k_shown} | {recorded_shown} | {shown} |")
          PY
          else
            printf '\n%s\n' "No golden-case snapshot, so no claim counts (K) to report." >> "$GITHUB_STEP_SUMMARY"
          fi
