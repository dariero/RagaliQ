version: 2

# Grouping is deliberate. Ungrouped, Dependabot opens one PR per dependency per
# week; the volume trains you to merge without reading, which is worse than a
# stale pin. Grouping trades per-dependency bisectability for a review that
# actually happens.
#
# NOT covered here:
#   - Python packages. The pip ecosystem is not enabled. GitHub's docs list
#     PEP 621 pyproject.toml and .txt files for it, not pylock.toml, so it
#     could move only the floors, and CI installs from the lock. Floors move
#     only when a feature requires it or support is deliberately dropped, and
#     the lock is regenerated by hand. See the dependency policy in AGENTS.md.
#   - pre-commit revs. The pre-commit ecosystem is not enabled: a PR that
#     moves ruff's rev to a new minor on its own fails check_ruff_atom, so
#     CONTRIBUTING.md carries a quarterly `pre-commit autoupdate` step instead.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "16:00"
      timezone: "Australia/Melbourne"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "[CHORE]"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: "16:00"
      timezone: "Australia/Melbourne"
    commit-message:
      prefix: "[CHORE]"
