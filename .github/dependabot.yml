version: 2

# Grouping is deliberate. Ungrouped, Dependabot opens one PR per dependency per
# week; the volume trains you to merge without reading, which is worse than a
# stale pin. Grouping trades per-dependency bisectability for a review that
# actually happens.
#
# The pip groups mirror the slice discipline the manual bumps used: a ruff bump
# rewrites formatting across the tree, and mixing that with a runtime bump makes
# the diff unreviewable. Keeping tooling and runtime apart preserves that.
#
# NOT covered here:
#   - pylock.toml. GitHub's docs list PEP 621 pyproject.toml and .txt files
#     for the pip ecosystem, not pylock.toml, so the lock is regenerated by
#     hand. Floors move only when a feature requires it or support is
#     deliberately dropped. See the dependency policy in AGENTS.md.
#   - pre-commit revs. The pre-commit ecosystem is not enabled: a PR that
#     moves ruff's rev to a new minor on its own fails check_ruff_atom, so
#     CONTRIBUTING.md carries a quarterly `pre-commit autoupdate` step instead.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "16:00"
      timezone: "Australia/Melbourne"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "[CHORE]"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "16:00"
      timezone: "Australia/Melbourne"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "[CHORE]"
    groups:
      # A ruff major produces a whole-tree lint/format diff. It must never share
      # a PR with a runtime bump.
      tooling:
        patterns:
          - ruff
          - mypy
          - pytest*
          - types-*
          - pre-commit
      runtime:
        patterns:
          - "*"
        exclude-patterns:
          - ruff
          - mypy
          - pytest*
          - types-*
          - pre-commit

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: "16:00"
      timezone: "Australia/Melbourne"
    commit-message:
      prefix: "[CHORE]"
